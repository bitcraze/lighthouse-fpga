# Build the project using the Bitcraze builder docker image
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly build to make sure dependencies are OK
    - cron:  '30 12 * * 4'
  workflow_dispatch:

jobs:
  build:
    uses: bitcraze/workflows/.github/workflows/basic_build.yml@2284e0bfa7ceefcf85bc28eff99b19cd0a7ff0d7
    with:
      builder_image: 'bitcraze/fpga-builder'
